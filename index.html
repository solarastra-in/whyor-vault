         Google reads sitemaps via a "Sitemap:" line in robots.txt (added
         there, see public/robots.txt) or direct Search Console submission.
         This tag is included only because it was explicitly requested; it
         has no effect on crawling. It's also currently inert either way,
         since robots.txt disallows all crawling of this app shell. -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <!-- This app is an authenticated single-page vault: everything past this shell is private,
         per-user data. There is no public content for Google to rank, so the shell is
         deliberately noindex'd rather than optimized for ranking. If/when a public marketing
         page is split out (see SEO notes), that page — and only that page — should be
         indexable with its own title/description/canonical and this noindex removed. -->
